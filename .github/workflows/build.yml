name: Build Single Executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # Headless testing needs the offscreen QPA platform.
  QT_QPA_PLATFORM: offscreen

# Required for softprops/action-gh-release to create releases & upload
# assets on tag pushes.
permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-6 libxext6 libxfixes3 \
            libxi6 libxrender1 libxtst6 libxcb1 libxcb-cursor0 \
            libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-util1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    name: Build executable
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-6 libxext6 libxfixes3 \
            libxi6 libxrender1 libxtst6 libxcb1 libxcb-cursor0 \
            libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-util1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller project_ecosystem.spec --noconfirm
          # Rename to include platform in the filename.
          cp dist/project-ecosystem dist/project-ecosystem-linux-x86_64

      - name: Smoke-test the executable
        run: |
          chmod +x dist/project-ecosystem-linux-x86_64
          # Launch in offscreen mode for 5 seconds; PASS if still alive.
          timeout 5 ./dist/project-ecosystem-linux-x86_64 &
          PID=$!
          sleep 3
          if kill -0 $PID 2>/dev/null; then
            echo "::notice::Executable launched and ran for 3 seconds without crashing."
            kill $PID 2>/dev/null || true
          else
            echo "::error::Executable crashed within 3 seconds."
            exit 1
          fi
          wait $PID 2>/dev/null || true

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-ecosystem-linux-x86_64
          path: dist/project-ecosystem-linux-x86_64
          retention-days: 30
          compression-level: 0  # already a single binary; no point re-compressing

      - name: Attach to GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/project-ecosystem-linux-x86_64
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tarball:
    name: Build source tarball
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          tar --transform 's,^,project-ecosystem/,' \
            --exclude='.git' --exclude='__pycache__' \
            --exclude='.pytest_cache' --exclude='build' \
            --exclude='dist' --exclude='saves/*.json' \
            --exclude='scripts/lib' \
            -czf project-ecosystem-src.tar.gz \
            ecosystem tests scripts .github \
            README.md requirements.txt setup.py pyproject.toml \
            run.sh project_ecosystem.spec launcher.py

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-ecosystem-src
          path: project-ecosystem-src.tar.gz
          retention-days: 30

      - name: Attach tarball to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: project-ecosystem-src.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
